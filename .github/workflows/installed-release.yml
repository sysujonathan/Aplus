name: Windows installed release
on:
  workflow_run:
    workflows: [A acceptance]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: aplus-installed-release
  cancel-in-progress: false
jobs:
  identity:
    # GitHub lists drafts only for a caller with push access. Keep that token
    # out of dependency installation, compiler execution, and package builds.
    permissions:
      contents: write
      actions: read
    if: github.repository == 'sysujonathan/Aplus' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.gate.outputs.build }}
      commit: ${{ steps.gate.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      sequence: ${{ steps.identity.outputs.sequence }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit exact accepted main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_preflight.py --output "$env:GITHUB_OUTPUT"
      - name: Allocate release identity
        id: identity
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          $main = gh api repos/$env:GITHUB_REPOSITORY/commits/main --jq .sha
          if ($head -ne $main) { throw 'Main moved; a later accepted main will build instead' }
          $releaseTime = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'China Standard Time')
          $date = $releaseTime.ToString('yyyy.MM.dd')
          $floor = [long]($releaseTime.ToString('yyyyMMdd')+'0000')
          $baseline = Get-Content packaging/release.json -Raw | ConvertFrom-Json
          $sequence = [Math]::Max($floor+1, [long]$baseline.sequence+1)
          $pages = gh api repos/$env:GITHUB_REPOSITORY/releases?per_page=100 --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list reserved release identities' }
          $pages = $pages | ConvertFrom-Json
          $releases = @($pages | ForEach-Object { $_ })
          foreach ($release in $releases) {
            if ($release.tag_name -match '^v(\d{4})\.(\d{1,2})\.(\d{1,2})\.(\d+)$') {
              $old = [long]('{0}{1:D2}{2:D2}{3:D4}' -f [int]$Matches[1],[int]$Matches[2],[int]$Matches[3],[int]$Matches[4])
              if ($old -ge $sequence) { $sequence = $old+1 }
            }
          }
          if ($sequence -ge $floor+10000) { throw 'Release sequence needs manual review' }
          $version = "$date.$($sequence-$floor)"
          "APLUS_VERSION=$version" >> $env:GITHUB_ENV
          "APLUS_SEQUENCE=$sequence" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "sequence=$sequence" >> $env:GITHUB_OUTPUT
  build:
    needs: identity
    env:
      APLUS_VERSION: ${{ needs.identity.outputs.version }}
      APLUS_SEQUENCE: ${{ needs.identity.outputs.sequence }}
    if: needs.identity.outputs.ready == 'true' && (github.repository == 'sysujonathan/Aplus' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.gate.outputs.build }}
      commit: ${{ steps.gate.outputs.commit }}
      version: ${{ needs.identity.outputs.version }}
      artifact: ${{ steps.installer.outputs.artifact-id }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            packaging/requirements-build.txt
      - name: Admit exact accepted main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_preflight.py --output "$env:GITHUB_OUTPUT"
      - if: steps.gate.outputs.build == 'true'
        run: python -m pip install -r requirements-lock.txt -r packaging/requirements-build.txt
      - name: Install verified compiler
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $compiler
          $signature = Get-AuthenticodeSignature $compiler
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B.V.') { throw 'Compiler signature mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'Inno'
          $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR='+$destination))
          $process = Start-Process $compiler -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "APLUS_ISCC=$destination\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build exact accepted main installer
        if: steps.gate.outputs.build == 'true'
        run: python tools/build_installer.py --official --version $env:APLUS_VERSION --sequence $env:APLUS_SEQUENCE --iscc "$env:APLUS_ISCC"
      - name: Installed GUI and WebView smoke
        if: steps.gate.outputs.build == 'true'
        shell: pwsh
        env:
          APLUS_INSTALL_SMOKE: '1'
        run: |
          $folder = Join-Path $env:RUNNER_TEMP ('AplusSmoke-'+[Guid]::NewGuid().ToString('N'))
          $application = Resolve-Path 'dist/AplusApp/AplusApp.exe'
          $process = Start-Process $application -ArgumentList @('--smoke-test',('"'+$folder+'"')) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Installed smoke timeout; inspect runner diagnostics' }
          if ($process.ExitCode -ne 0) { throw 'Installed smoke process failed' }
          $result = Get-Content (Join-Path $folder 'result.json') -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.webview_ready) { throw 'Installed chart not ready' }
      - uses: actions/upload-artifact@v4
        id: installer
        if: steps.gate.outputs.build == 'true'
        with:
          name: AplusSetup-${{ env.APLUS_VERSION }}-verified
          path: dist/installers/*
          retention-days: 30
          if-no-files-found: error
  publish:
    needs: build
    if: needs.build.outputs.ready == 'true' && github.repository == 'sysujonathan/Aplus' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: release-package
          merge-multiple: true
      - name: Publish verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          APLUS_VERSION: ${{ needs.build.outputs.version }}
          APLUS_COMMIT: ${{ needs.build.outputs.commit }}
        run: >-
          python tools/publish_installer.py
          "release-package/AplusSetup-${APLUS_VERSION}-x64.exe"
          --manifest release-package/latest.json --expected-commit "$APLUS_COMMIT"
          --resume --verify-online --receipt release-package/published.json
      - uses: actions/upload-artifact@v4
        with:
          name: Aplus-published-${{ needs.build.outputs.version }}
          path: release-package/published.json
          if-no-files-found: error
